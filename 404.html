  <style>
    :root {
      --primary: #F39600;
      --primary-dark: #D48200;
      --gray-900: #46454B;
      --gray-700: #52515A;
      --warm-white: #F7F7FA;
      --white: #FFFFFF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--warm-white);
      color: var(--gray-700);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      min-height: 100svh;
    }
    .logo {
      width: 200px;
      height: auto;
      margin-bottom: 40px;
    }
    .code {
      font-family: 'Exo', sans-serif;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-family: 'Exo', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1.08rem;
      line-height: 1.6;
      max-width: 420px;
      margin: 0 auto 36px;
      color: var(--gray-700);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      border-radius: 100px;
      background: var(--primary);
      color: var(--white);
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(243, 150, 0, 0.25);
      transition: transform 0.18s ease-out, background 0.25s ease-out;
    }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <picture>
